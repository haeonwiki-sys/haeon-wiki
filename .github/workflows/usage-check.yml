# 한 번만 쓰는 점검용 (확인 뒤 지움)
name: 사용량 확인
on:
  push:
    branches: [main]
    paths: ['ops/usage.mjs', '.github/workflows/usage-check.yml']
permissions:
  contents: write
jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node ops/usage.mjs
      - run: |
          git config user.name "haeon-wiki-bot"
          git config user.email "haeonwiki-sys@users.noreply.github.com"
          git add ops/usage.json
          git commit -m "사용량 확인 결과 (자동)"
          git push
